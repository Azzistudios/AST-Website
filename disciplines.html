  <style>
    @font-face { font-family: 'Syne'; src: url('Fonts/Syne-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Syne'; src: url('Fonts/Syne-Medium.ttf') format('truetype'); font-weight: 500; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Syne'; src: url('Fonts/Syne-SemiBold.ttf') format('truetype'); font-weight: 600; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Syne'; src: url('Fonts/Syne-Bold.ttf') format('truetype'); font-weight: 700; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Syne'; src: url('Fonts/Syne-ExtraBold.ttf') format('truetype'); font-weight: 800; font-style: normal; font-display: swap; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #ffffff;
      --text:   #000000;
      --dark:   #1d1d1d;
      --muted:  #a3a3a3;
      --border: #e0e0e0;
      --pad:    40px;
      --gap:    3px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Syne', Helvetica, Arial, sans-serif;
      font-weight: 400;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    a { text-decoration: none; color: inherit; }

    /* ── NAV ── */
    .site-nav {
      position: sticky;
      top: 0;
      z-index: 200;
      background: var(--bg);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 var(--pad);
      height: 80px;
    }

    .nav-logo { font-family: 'Syne', sans-serif; font-size: 21px; font-weight: 700; letter-spacing: -0.01em; word-spacing: 0.55em; text-transform: uppercase; white-space: nowrap; }
    .st-mark { display:inline-block; text-decoration:none; }
    .brand-wm { font-family: 'Syne', sans-serif !important; font-size: 22px !important; font-weight: 700; letter-spacing: -0.01em; text-transform: uppercase; white-space: nowrap; }
    .lang-toggle { justify-self: end; display: flex; align-items: center; border: 1px solid var(--border); border-radius: 100px; padding: 2px; gap: 0; }
    .lang-btn { font-family: 'Syne', sans-serif; font-size: 9px; font-weight: 600; letter-spacing: 0.13em; text-transform: uppercase; background: none; border: none; cursor: pointer; padding: 4px 10px; border-radius: 100px; color: var(--text); opacity: 0.4; transition: background 0.2s, color 0.2s, opacity 0.2s; }
    .lang-btn.active { background: var(--text); color: var(--bg); opacity: 1; } .lang-btn:hover:not(.active) { opacity: 0.7; } .lang-sep { display: none; }
    .nav-links { display: flex; gap: 36px; list-style: none; }
    .nav-links a { font-size: 12px; font-weight: 500; letter-spacing: 0.13em; text-transform: uppercase; transition: opacity 0.2s; }
    .nav-links a:hover { opacity: 0.4; }
    .nav-links a.active { border-bottom: 1px solid #000; padding-bottom: 1px; }

    /* ── PAGE HEADING ── */
    .page-heading {
      padding: 48px var(--pad) 32px;
      border-bottom: 1px solid var(--border);
    }

    .page-heading h1 {
      font-size: clamp(23px, 3.9vw, 52px);
      font-weight: 800;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 32px;
    }

    /* ── FILTER PILLS ── */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-pill {
      padding: 5px 16px;
      border: 1px solid #000;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      background: transparent;
      font-family: inherit;
    }

    .filter-pill:hover,
    .filter-pill.active {
      background: #000;
      color: #fff;
    }

    /* ── MOSAIC GRID ── */
    .mosaic {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0;
    }

    .m { overflow: hidden; background: #d8d8d8; aspect-ratio: 1; }
    .m img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity 0.35s; }
    .m:hover img { opacity: 0.82; }

    /* ── FOOTER ── */
    footer { border-top: 1px solid var(--dark); padding: 40px var(--pad) 28px; }
    
    
    
    .footer-cols { display: grid; grid-template-columns: 1.8fr 1fr 1.8fr; gap: 32px; margin-bottom: 36px; }
    .fc-list { list-style: none; }
    .fc-list li { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 11px; }
    .fc-list li a { color: inherit; text-decoration: none; transition: opacity 0.2s; }
    .fc-list li a:hover { opacity: 0.45; }
    .footer-bottom { display: flex; align-items: center; justify-content: space-between; padding-top: 20px; border-top: 1px solid var(--border); }
    .copyright { font-size: 11px; color: #8a8a8a; letter-spacing: 0.08em; text-transform: uppercase; }
    .footer-ecosystem { font-size: 11px; color: #8a8a8a; letter-spacing: 0.04em; }

    @media (max-width: 768px) {
      :root { --pad: 20px; }
      .nav-links { gap: 16px; }
      .nav-links a { font-size: 9px; }
      .mosaic { grid-template-columns: repeat(3, 1fr); }
      .m.c3 { grid-column: span 3; }
      .m.c2 { grid-column: span 2; }
      .footer-cols { grid-template-columns: 1fr 1fr; }
      .footer-bottom { flex-direction: column; gap: 10px; text-align: center; }
    }
    /* ── ANIMATIONS ── */
    @keyframes _navIn   { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes _titleIn { from { opacity:0; transform:translateY(44px);  } to { opacity:1; transform:translateY(0); } }
    .site-nav        { animation: _navIn  0.55s cubic-bezier(0.22,1,0.36,1) both; }
    .page-heading h1 { animation: _titleIn 1.0s cubic-bezier(0.22,1,0.36,1) 0.15s both; }
    .rv      { opacity:0; transform:translateY(26px); transition:opacity 0.8s cubic-bezier(0.22,1,0.36,1),transform 0.8s cubic-bezier(0.22,1,0.36,1); transition-delay:var(--d,0ms); }
    .rv.in   { opacity:1; transform:translateY(0); }
    .rv-fade { opacity:0; transition:opacity 0.8s cubic-bezier(0.22,1,0.36,1); transition-delay:var(--d,0ms); }
    .rv-fade.in { opacity:1; }
    .rv-m    { opacity:0; transform:scale(0.94); transition:opacity 0.55s cubic-bezier(0.22,1,0.36,1),transform 0.55s cubic-bezier(0.22,1,0.36,1); transition-delay:var(--d,0ms); }
    .rv-m.in { opacity:1; transform:scale(1); }
    .m { transition: opacity 0.3s cubic-bezier(0.22,1,0.36,1); }
    .m.hidden { display: none; }
    @media (prefers-reduced-motion:reduce) { .rv,.rv-fade,.rv-m,.site-nav,.page-heading h1 { animation:none!important; transition:none!important; opacity:1!important; transform:none!important; } }

  <script>
    (function(){
      var io=new IntersectionObserver(function(e){e.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:0.1});
      document.querySelectorAll('.rv,.rv-fade').forEach(function(el){io.observe(el);});
      var mosaicObs=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting){e.target.querySelectorAll('.rv-m').forEach(function(cell,i){cell.style.setProperty('--d',Math.min(i*28,560)+'ms');setTimeout(function(){cell.classList.add('in');},0);});mosaicObs.unobserve(e.target);}});},{threshold:0.05});
      var mosaic=document.querySelector('.mosaic');
      if(mosaic){mosaic.querySelectorAll('.m').forEach(function(m){m.classList.add('rv-m');});mosaicObs.observe(mosaic);}
    })();
  </script>
  <script>
    var T={en:{'nav-work':'Work','nav-about':'About','nav-disciplines':'Disciplines','nav-contact':'Contact','disc-page-title':'Disciplines','filter-all':'All','filter-fashion':'Fashion Shows','filter-brand':'Brand Experiences','filter-events':'Special Events','footer-location':'Beirut, Lebanon','copyright':'© 2026 Atelier Sans Titre. All rights reserved.'},fr:{'nav-work':'Travail','nav-about':'À Propos','nav-disciplines':'Disciplines','nav-contact':'Contact','disc-page-title':'Disciplines','filter-all':'Tous','filter-fashion':'Défilés de Mode','filter-brand':'Expériences de Marque','filter-events':'Événements Spéciaux','footer-location':'Beyrouth, Liban','copyright':'© 2026 Atelier Sans Titre. Tous droits réservés.'}};
    function applyLang(l){document.documentElement.lang=l;document.querySelectorAll('[data-i18n]').forEach(function(el){var k=el.getAttribute('data-i18n');if(T[l]&&T[l][k]!==undefined)el.innerHTML=T[l][k];});document.querySelectorAll('.lang-btn').forEach(function(b){b.classList.toggle('active',b.dataset.lang===l);});localStorage.setItem('ast-lang',l);}
    document.querySelectorAll('.lang-btn').forEach(function(b){b.addEventListener('click',function(){applyLang(b.dataset.lang);});});
    var s=localStorage.getItem('ast-lang')||'en';if(s==='fr')applyLang('fr');
  </script>
  <script>
    (function(){
      var pills = document.querySelectorAll('.filter-pill');
      var items = document.querySelectorAll('.mosaic .m');
      pills.forEach(function(pill){
        pill.addEventListener('click', function(){
          pills.forEach(function(p){ p.classList.remove('active'); });
          pill.classList.add('active');
          var filter = pill.getAttribute('data-filter');
          items.forEach(function(item){
            if(filter === 'all' || item.getAttribute('data-category') === filter){
              item.classList.remove('hidden');
            } else {
              item.classList.add('hidden');
            }
          });
        });
      });
    })();
  </script>
