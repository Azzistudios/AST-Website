    @font-face { font-family: 'Syne'; src: url('Fonts/Syne-Regular.woff2') format('woff2'), url('Fonts/Syne-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: swap; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #ffffff;
      --text:   #000000;
      --dark:   #1d1d1d;

    html { scroll-behavior: smooth; }

    body {

    a { text-decoration: none; color: inherit; }

    /* ── NAV ── */
    .site-nav {
      position: sticky;
      top: 0;
      z-index: 200;
      background: var(--bg);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 var(--pad);
      height: 80px;
    }

    .nav-logo { font-family: 'Syne', sans-serif; font-size: 21px; font-weight: 700; letter-spacing: -0.01em; word-spacing: 0.55em; text-transform: uppercase; white-space: nowrap; }

    .lang-btn.active { color: var(--text); opacity: 1; box-shadow: inset 0 -1px 0 currentColor; } .lang-btn:hover:not(.active) { opacity: 0.7; } .lang-sep { display: inline; opacity: 0.4; }
    .nav-links { display: flex; gap: 36px; list-style: none; }
    .nav-links a { font-size: 12px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; position: relative; }
    .nav-links a::after { content: ''; position: absolute; left: 0; right: 0; bottom: -4px; height: 1px; background: currentColor; transform: scaleX(0); transform-origin: left; transition: transform 0.4s cubic-bezier(0.22,1,0.36,1); }
    .nav-links a:hover::after, .nav-links a.active::after { transform: scaleX(1); }
    .nav-links a.active { opacity: 1; }

    /* ── PAGE HEADING ── */
    .page-heading {
      padding: 48px var(--pad) 32px;
      border-bottom: 1px solid var(--border);
    }

    .page-heading h1 {

    /* ── FILTER PILLS ── */
    .filters {

    .filter-pill {

    .filter-pill:hover,
    .filter-pill.active {
      background: #000;

    }

    /* ── MOSAIC GRID ── */
    .mosaic {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0;
    }

    .m { overflow: hidden; background: #d8d8d8; aspect-ratio: 1; }

    /* ── FOOTER ── */
    footer { border-top: 1px solid #cfcfcf; padding: 40px var(--pad) 28px; }
    
    
    
    .footer-cols { display: grid; grid-template-columns: 1.8fr 1fr 1.8fr; gap: 32px; margin-bottom: 36px; }

    @media (min-width: 769px) and (max-width: 1024px) {

    @media (max-width: 768px) {
      :root { --pad: 20px; }

      /* ── MOBILE NAV ── */
      .site-nav { grid-template-columns: 1fr auto; height: 56px; }
      .site-nav > nav,
      .site-nav > .lang-toggle { display: none; }
      .nav-burger { display: flex; flex-direction: column; justify-content: center; gap: 5px; width: 36px; height: 36px; padding: 4px; cursor: pointer; }
      .nav-burger span { display: block; width: 22px; height: 1.5px; background: currentColor; transition: transform 0.25s cubic-bezier(0.22,1,0.36,1), opacity 0.25s; }
      .site-nav.nav-open { position: fixed; inset: 0; height: 100vh; height: 100dvh; display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 56px 1fr 72px; align-items: start; z-index: 300; overscroll-behavior: contain; }
      .site-nav.nav-open > :first-child { grid-column: 2; grid-row: 1; justify-self: center; align-self: center; }
      .site-nav.nav-open .nav-burger { grid-column: 3; grid-row: 1; justify-self: end; align-self: center; }
      .site-nav.nav-open > nav { display: flex; grid-column: 1 / -1; grid-row: 2; align-items: center; justify-content: center; padding-top: 80px; overflow-y: auto; min-height: 0; max-height: 100%; }
      .site-nav.nav-open .nav-links { display: flex; flex-direction: column; align-items: center; gap: 32px; list-style: none; padding: 0; margin: 0; }
      .site-nav.nav-open .nav-links a { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; text-transform: uppercase; opacity: 1; }
      .site-nav.nav-open > .lang-toggle { display: flex; grid-column: 1 / -1; grid-row: 3; justify-self: center; align-self: center; }
      .site-nav.nav-open .nav-burger span:nth-child(1) { transform: translateY(3.5px) rotate(45deg); }
      .site-nav.nav-open .nav-burger span:nth-child(2) { transform: translateY(-3.5px) rotate(-45deg); }

      /* ── LAYOUT ── */
      .page-heading { padding: 36px var(--pad) 28px; }
      .page-heading h1 { font-size: clamp(22px, 7vw, 36px); margin-bottom: 20px; }
      .filters { gap: 8px; }

      .mosaic { grid-template-columns: repeat(3, 1fr); }
      .footer-cols { grid-template-columns: 1fr; }
      .footer-bottom { flex-direction: column; gap: 10px; text-align: center; }
    }
    /* ── ANIMATIONS ── */
    @keyframes _navIn   { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes _titleIn { from { opacity:0; transform:translateY(44px);  } to { opacity:1; transform:translateY(0); } }
    .site-nav        { animation: _navIn  0.55s cubic-bezier(0.22,1,0.36,1) both; }
    .page-heading h1 { animation: _titleIn 1.0s cubic-bezier(0.22,1,0.36,1) 0.15s both; }
    .rv      { opacity:0; transform:translateY(16px); transition:opacity 1.0s cubic-bezier(0.22,1,0.36,1),transform 1.0s cubic-bezier(0.22,1,0.36,1); transition-delay:var(--d,0ms); }
    .rv.in   { opacity:1; transform:translateY(0); }
    .rv-fade { opacity:0; transition:opacity 1.0s cubic-bezier(0.22,1,0.36,1); transition-delay:var(--d,0ms); }
    .rv-fade.in { opacity:1; }
    .rv-m    { opacity:0; transform:scale(0.985); transition:opacity 0.75s cubic-bezier(0.22,1,0.36,1),transform 0.75s cubic-bezier(0.22,1,0.36,1); transition-delay:var(--d,0ms); }
    .rv-m.in { opacity:1; transform:scale(1); }
    .m.hidden { display: none; }
    :focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
    .filter-pill:focus-visible { outline-color: #000; }
    @media (prefers-reduced-motion:reduce) { html { scroll-behavior: auto; } .rv,.rv-fade,.rv-m,.site-nav,.page-heading h1 { animation:none!important; transition:none!important; opacity:1!important; transform:none!important; } }
  </style>
</head>

  <script>
    (function(){
      function tidy(el){
        var done=false;
        function strip(ev){
          if(done||(ev&&ev.target!==el))return;
          done=true;
          el.classList.remove('rv','rv-fade');
          el.removeEventListener('transitionend',strip);
        }
        el.addEventListener('transitionend',strip);
        setTimeout(strip,1700);
      }
      var io=new IntersectionObserver(function(e){e.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');tidy(e.target);io.unobserve(e.target);}});},{threshold:0.1});
      document.querySelectorAll('.rv,.rv-fade').forEach(function(el){io.observe(el);});
      var mosaicObs=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting){e.target.querySelectorAll('.rv-m').forEach(function(cell,i){cell.style.setProperty('--d',Math.min(i*40,720)+'ms');setTimeout(function(){cell.classList.add('in');},0);});mosaicObs.unobserve(e.target);}});},{threshold:0.05});
      var mosaic=document.querySelector('.mosaic');
      if(mosaic){mosaic.querySelectorAll('.m').forEach(function(m){m.classList.add('rv-m');});mosaicObs.observe(mosaic);}
    })();
  </script>
  <script>
    (function(){
      var pills = document.querySelectorAll('.filter-pill');
      var items = document.querySelectorAll('.mosaic .m');
      pills.forEach(function(pill){
        pill.addEventListener('click', function(){
          pills.forEach(function(p){ p.classList.remove('active'); p.setAttribute('aria-pressed','false'); });
          pill.classList.add('active');
          pill.setAttribute('aria-pressed','true');
          var filter = pill.getAttribute('data-filter');
          items.forEach(function(item){
            if(filter === 'all' || item.getAttribute('data-category') === filter){
              item.classList.remove('hidden');
            } else {
              item.classList.add('hidden');
            }
          });
        });
      });
    })();
  </script>
  <script>
    (function(){
      var burger = document.querySelector('.nav-burger');
      var nav    = document.querySelector('.site-nav');
      if (!burger) return;
      function closeMenu(){
        nav.classList.remove('nav-open');
        burger.setAttribute('aria-expanded','false');
        document.body.style.overflow = '';
      }
      burger.addEventListener('click', function(){
        var open = nav.classList.toggle('nav-open');
        burger.setAttribute('aria-expanded', String(open));
        document.body.style.overflow = open ? 'hidden' : '';
      });
      document.querySelectorAll('.nav-links a').forEach(function(a){
        a.addEventListener('click', closeMenu);
      });
      /* release the menu + scroll lock if the viewport crosses to desktop */
      var mq = window.matchMedia('(min-width: 769px)');
      function onMq(e){ if (e.matches) closeMenu(); }
      if (mq.addEventListener) mq.addEventListener('change', onMq); else mq.addListener(onMq);
    })();
  </script>
